[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bia-img-captioner"
version = "0.2.0"
description = "Image captioning: pretrained ViT / ResNet or a from-scratch ViT encoder + Transformer decoder."
readme = "README.md"
authors = [{ name = "Ben alla ismail", email = "ismailbenalla@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
  "datasets>=3.6",
  "numpy",
  "pillow>=10.1",
  "torch>=2.2",
  "torchvision>=0.17",
  "transformers>=4.49",
]

[project.scripts]
cap-train = "bia_captioner.train:main"
cap-generate = "bia_captioner.generate:main"
cap-evaluate = "bia_captioner.evaluate:main"

[project.optional-dependencies]
app = ["streamlit>=1.34"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "nbformat>=5"]

[tool.hatch.build.targets.wheel]
packages = ["src/bia_captioner"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy"]
